function autoSettle(date=today){const key=date.slice(0,7),[year,month]=key.split('-').map(Number);if(!validDate(date))return 0;const old=clone(),seen=new Set(state.receipts.map(r=>r.occurrence).filter(Boolean)),suppressed=new Set(state.suppressedOccurrences||[]);let count=0;for(const s of state.sources){for(const p of planned(s,year,month-1)){if(seen.has(p.key)||suppressed.has(p.key)||!automaticEligible(p)||!account(p.account)||(account(p.account).closedAt||account(p.account).archivedAt))continue;const dueDate=scheduledDate(p);if(!dueDate||dueDate>date||dueDate<s.start)continue;state.receipts.push({id:UID(),source:p.source,account:p.account,date:dueDate,amount:Number(p.amount),kind:'regular',occurrence:p.key,concept:p.label+' · '+p.month,registration:'automatic'});seen.add(p.key);count++}}if(count&&!save(old))return 0;return count}
function autoSettleDebt(date=today){if(!validDate(date))return 0;const old=clone(),month=date.slice(0,7),[year,mm]=month.split('-').map(Number),days=new Date(year,mm,0).getDate();let count=0;for(const d of state.debts){if(!d.autoEnabled||!Number.isFinite(Number(d.payment))||Number(d.payment)<=0||!Number.isInteger(Number(d.paymentDay))||Number(d.paymentDay)<1||Number(d.paymentDay)>31||!validDate(d.autoStart||'')||d.frequency==='irregular')continue;const acc=account(d.paymentAccountId);if(!acc||acc.closedAt||acc.archivedAt)continue;const startMonth=d.autoStart.slice(0,7),startY=Number(startMonth.slice(0,4)),startM=Number(startMonth.slice(5,7)),delta=(year-startY)*12+mm-startM,step={monthly:1,quarterly:3,annual:12}[d.frequency];if(!step||delta<0||delta%step!==0)continue;const dueDate=month+'-'+pad(Math.min(Number(d.paymentDay),days)),key=d.id+':'+month;if(dueDate>date||dueDate<d.autoStart||(d.endDate&&dueDate>d.endDate)||(state.suppressedDebtOccurrences||[]).includes(key))continue;if(state.expenses.some(e=>e.occurrence===key||e.debtPaymentId===d.id&&e.date.slice(0,7)===month))continue;if(state.expenses.some(e=>e.account===acc.id&&e.date===dueDate&&Math.abs(Number(e.amount)-Number(d.payment))<0.005))continue;const interest=d.interestPerPayment==null?null:Number(d.interestPerPayment);state.expenses.push({id:UID(),account:acc.id,date:dueDate,amount:Number(d.payment),concept:'Cuota de '+d.name,debtPaymentId:d.id,principalPaid:null,interestPaid:interest,occurrence:key,registration:'automatic'});count++}if(count&&!save(old))return 0;return count}

function incomeView(){const real=state.receipts.filter(r=>inPeriod(r.date)),plans=plannedPeriod(),pending=plans.filter(p=>!actualFor(p)),extras=real.filter(r=>r.kind!=='regular');return `<div class="heading"><div><div class="eyebrow">Cuentas y patrimonio / 02</div><h1>Mis ingresos</h1><p>Consulta tus cobros habituales configurados en patrimonio y registra ingresos puntuales en segundos.</p></div><button class="primary" onclick="openQuickReceipt()">＋ Ingreso puntual</button></div><div class="filters"><button class="ghost" onclick="shift(-1)">‹</button><strong style="min-width:175px;text-align:center;text-transform:capitalize">${E(periodLabel())}</strong><button class="ghost" onclick="shift(1)">›</button><select onchange="period=this.value;render()">${opts([['monthly','Mes'],['quarterly','Trimestre'],['semiannual','Semestre'],['yearly','Año']],period)}</select></div><div class="grid"><div class="stat"><span>Ingresos cobrados</span><strong>${EUR(sum(real))}</strong><span>Registrados (automáticos y manuales)</span></div><div class="stat"><span>Habituales pendientes</span><strong>${EUR(sum(pending))}</strong><span>${pending.length} previsiones sin confirmar</span></div><div class="stat"><span>Ingresos puntuales</span><strong>${EUR(sum(extras))}</strong><span>Incluidos en el total cobrado</span></div></div><div class="notice">Los ingresos habituales se configuran en «Mi patrimonio e inversiones». Los ingresos habituales fijos pueden registrarse automáticamente al llegar la fecha. Los importes variables o sin fecha calculable permanecen previstos. Un cobro automático no equivale a una verificación bancaria.</div><section class="panel"><div class="panel-head"><div><h2>Cobros habituales del período</h2><p class="small">Confirma lo recibido o ajusta el importe solo para este mes.</p></div><button class="tiny ghost" onclick="configureHabitual()">Configurar habituales ↗</button></div>${plans.length?plans.map(p=>{const r=actualFor(p),src=source(p.source);return `<div class="item function assetsView(){const cash=sum(state.accounts.map(a=>({amount:balance(a.id)}))),invest=sum(state.assets.filter(a=>a.kind==='investment')),property=sum(state.assets.filter(a=>a.kind!=='investment')),debt=sum(state.debts.map(x=>({amount:x.balance}))),net=cash+invest+property-debt;return `<div class="heading"><div><div class="eyebrow">Cuentas y patrimonio / 01</div><h1>Mi patrimonio e inversiones</h1><p>Todo lo que tienes y lo que debes, sin duplicar cuentas ni movimientos.</p></div><button class="primary" onclick="openAssetChooser()">＋ Añadir elemento</button></div><div class="grid"><div class="stat"><span>Patrimonio neto estimado</span><strong>${EUR(net)}</strong><span>Activos menos deudas</span></div><div class="stat"><span>Dinero en cuentas y efectivo</span><strong>${EUR(cash)}</strong><span>Saldo calculado a partir de movimientos</span></div><div class="stat"><span>Inversiones y bienes</span><strong>${EUR(invest+property)}</strong><span>Valores declarados, no cotizaciones en tiempo real</span></div></div><section class="panel"><div class="panel-head"><div><h2>Ingresos habituales</h2><p class="small">Configúralos una vez. Salvia los programará automáticamente en «Mis ingresos».</p></div><button class="primary tiny" onclick="openSource()">＋ Añadir habitual</button></div>${state.sources.length?state.sources.map(s=>{const v=version(s,monthId(yr,mo));return `<div class="item"><div class="item-head"><div><strong>${E(s.name)}</strong><p class="small">${E(categories[s.category])} · ${E(frequency[v.frequency])} · ${E(account(v.account)?.name||'Sin cuenta')}</p></div><div style="text-align:right"><b>${EUR(v.amount)}</b><div class="small muted">${v.frequency==='irregular'?'Sin programación':'Importe de referencia'}</div></div></div><div class="actions"><button class="tiny" onclick="openSource('${E(s.id)}')">Editar configuración</button><button class="tiny ghost" onclick="go('income')">Ver cobros ↗</button><button class="tiny ghost" onclick="stopSource('${E(s.id)}')">De function positionModal(){const w=document.querySelector('.modal-wrap');if(!w)return;let offset=0,height=window.innerHeight;try{if(window.parent!==window){const rect=window.frameElement.getBoundingClientRect();offset=Math.max(0,-rect.top);height=Math.max(280,Math.min(window.parent.innerHeight,rect.bottom)-Math.max(0,rect.top))}}catch(e){const v=window.__salviaViewport||{};offset=Number(v.offset)||0;height=Number(v.height)||height}w.style.setProperty('position','absolute','important');w.style.setProperty('inset','auto 0 auto 0','important');w.style.setProperty('top',Math.round(offset)+'px','important');w.style.setProperty('height',Math.round(height)+'px','important');w.style.setProperty('min-height','0','important');const dialog=w.querySelector('.modal');if(dialog)dialog.style.maxHeight=Math.max(240,height-32)+'px'}
function modal(title,body,actions=''){const root=document.getElementById('modalRoot');if(root.parentElement!==document.body)document.body.append(root);root.style.position='absolute';root.style.top='0';root.style.left='0';root.style.right='0';root.style.zIndex='9999';root.innerHTML=`<div class="modal-wrap" onclick="if(event.target===this)closeModal()"><section class="modal" role="dialog" aria-modal="true" aria-label="${E(title)}"><div class="modal-head"><h2>${E(title)}</h2><button class="tiny ghost" onclick="closeModal()" aria-label="Cerrar">✕</button></div>${body}${actions}</section></div>`;positionModal();document.querySelector('.modal input,.modal select,.modal button')?.focus({preventScroll:true});requestAnimationFrame(positionModal)}function closeModal(){document.getElementById('modalRoot').innerHTML=''}function field(name,label,value='',type='text',attr=''){return `<div><label for="f_${E(name)}">${E(label)}</label><input id="f_${E(name)}" name="${E(name)}" type="${type}" value="${E(value)}" ${attr}></div>`}function selectField(name,label,values,v){return `<div><label for="f_${name}">${E(label)}</label><select id="f_${name}" name="${name}">${opts(values,v)}</select></div>`}function formData(id){return Object.fromEntries(new FormData(document.getElementById(id)))}function submitForm(id,fn){document.getElementById(id).addEventListener('submit',e=>{e.preventDefault();fn(formData(id))})}function formWrap(id,fields,button='Guardar'){return `<form id="${id}"><div class="fields">${fields}</div><div class="actions" style="margin-top:20px"><button class="primary" type="submit">${E(button)}</button><button type="button" class="ghost" onclick="closeModal()">Cancelar</button></div></form>`}

function createAccountInForm(f){const holder=document.createElement('div');holder.className='full';holder.id='inlineAccount';holder.innerHTML=`<div class="notice"><strong>Nueva cuenta de destino</strong><div class="fields" style="margin-top:10px"><div><label>Nombre de la cuenta</label><input id="newAccountName" placeholder="Ej. Cuenta secundaria" required></div><div><label>Tipo</label><select id="newAccountType"><option value="bank">Cuenta bancaria</option><option value="cash">Efectivo</option><option value="remunerated">Cuenta remunerada</option></select></div><div><label>Uso habitual</label><select id="newAccountRole"><option value="primary">Principal</option><option value="secondary">Secundaria</option><option value="other">Otro</option></select></div><div><label>Saldo inicial (€)</label><input id="newAccountOpening" type="number" step="0.01" value="0"></div></div><div class="actions"><button type="button" class="tiny primary" id="createAccountBtn">Guardar cuenta</button><button type="button" class="tiny ghost" id="cancelAccountBtn">Cancelar</button></div></div>`;document.getElementById('inlineAccount')?.remove();f.querySelector('.fields').append(holder);document.getElementById('cancelAccountBtn').onclick=()=>{holder.remove();f.account.value=state.accounts[0]?.id||''};document.getElementById('createAccountBtn').onclick=()=>{const name=document.getElementById('newAccountName').value.trim(),type=document.getElementById('newAccountType').value,opening=amount(document.getElementById('newAccountOpening').value);if(!name||!Number.isFinite(opening)){alert('Indica un nombre y un saldo inicial válido.');return}const old=clone(),a={id:UID(),name,type,role:document.getElementById('newAccountRole').value,opening};state.accounts.push(a);if(save(old)){const o=document.createElement('option');o.value=a.id;o.textContent=a.name;f.account.add(o,f.account.options[f.account.options.length-1]);f.account.value=a.id;holder.remove();toast('Cuenta creada sin perder el formulario')}}}

function addSalaryBonus(p={}){const host=document.getElementById('svBonusRows');if(!host)return;const row=document.createElement('div');row.className='sv-bonus';row.style.cssText='border:1px solid #34566a;border-radius:12px;padding:12px;margin:9px 0;display:grid;grid-template-columns:1fr 1fr;gap:9px';row.innerHTML='<label>Concepto<input data-bonus-label placeholder="Ej. Incentivo anual"></label><label>Tipo de cálculo<select data-bonus-method><option value="fixed">Importe fijo</option><option value="percentage">Porcentaje</option><option value="variable">Variable / desconocido</option></select></label><label>Importe o porcentaje<input data-bonus-value type="number" min="0" step=".01" value="0"></label><label>Base de cálculo<select data-bonus-basis><option value="gross">Bruto anual (neto desconocido)</option><option value="base">Salario base (neto desconocido)</option><option value="net_known">Base neta conocida</option><option value="other">Otra base</option></select></label><label>Base neta conocida (€)<input data-bonus-base type="number" min="0" step=".01"></label><label>Periodicidad<select data-bonus-frequency><option value="yearly">Anual</option><option value="quarterly">Trimestral</option><option value="monthly">Mensual</option></select></label><label>Mes de cobro<select data-bonus-month>'+Array.from({length:12},(_,i)=>'<option value="'+(i+1)+'">'+new Date(2026,i,1).toLocaleDateString('es-ES',{month:'long'})+'</option>').join('')+'</select></label><button type="button" class="tiny ghost" onclick="this.closest(\'.sv-bonus\').remove()">Quitar</button>';host.append(row);for(const [k,v] of Object.entries({label:p.label,method:p.method,value:p.value,basis:p.basis,base:p.baseAmount,frequency:p.frequency,month:p.month})){if(v!==undefined&&v!==null){const el=row.querySelector('[data-bonus-'+k+']');if(el)el.value=v}}}

function closeAccount(id){const a=account(id);if(!a)return;if(a.closedAt||a.archivedAt){modal('Gestionar cuenta cerrada',`<div class="notice"><b>${E(a.name)}</b> · ${EUR(balance(id))}. Esta cuenta figura como cerrada. Puedes reabrirla para gestionar su saldo, o eliminar el registro si se creó por error.</div><div class="actions"><button class="primary" onclick="reopenAccount('${E(id)}')">Reabrir y gestionar saldo</button><button onclick="deleteClosedAccount('${E(id)}')">Eliminar registro erróneo</button><button class="ghost" onclick="closeModal()">Cancelar</button></div>`);return}const value=balance(id);modal('Cerrar o corregir cuenta',`<div class="notice"><b>${E(a.name)}</b> · saldo calculado ${EUR(value)}</div><p>¿Qué ocurrió con esta cuenta y su dinero?</p><div class="actions" style="flex-direction:column;align-items:stretch"><button onclick="accountClosure('${E(id)}','transfer')">Trasladé el saldo a otra cuenta</button><button onclick="accountClosure('${E(id)}','spent')">Gasté el saldo o salió de mi patrimonio</button><button onclick="archiveAccount('${E(id)}')">Conservar saldo y archivar</button><button class="ghost" onclick="closeModal()">Cancelar</button></div>`)}function accountClosure(id,mode){const a=account(id);if(!a||a.closedAt||a.archivedAt)return;const linked=state.sources.filter(x=>x.account===id&&!x.end);if(linked.length){alert('Esta cuenta recibe ingresos habituales activos ('+linked.map(x=>x.name).join(', ')+'). Cambia primero su cuenta de destino o detén esas fuentes antes de cerrar la cuenta.');return}const value=balance(id);if(mode==='error'){if(state.receipts.some(r=>r.account===id)||state.expenses.some(r=>r.account===id)||state.transfers.some(t=>t.from===id||t.to===id)||state.sources.some(s=>s.account===id)){alert('La cuenta tiene movimientos o fuentes vinculadas. Corrígelos o trasládalos antes de eliminarla.');return}if(!confirm('¿Eliminar esta cuenta creada por error? Su saldo declarado dejará de formar parte del patrimonio.'))return;const o function recordDebtPayment(id){const debt=state.debts.find(x=>x.id===id);if(!debt)return;const accounts=state.accounts.filter(a=>!a.closedAt&&!a.archivedAt);if(!accounts.length){alert('Primero registra una cuenta activa.');return}const last=state.expenses.filter(e=>e.debtPaymentId===id).sort((a,b)=>String(b.date).localeCompare(String(a.date)))[0];modal('Registrar pago · '+debt.name,formWrap('debtPaymentForm',`${field('amount','Importe total pagado (€)',debt.payment??'','number','min="0.01" step="0.01" required')}${selectField('account','Cuenta de pago',accounts.map(a=>[a.id,a.name]),accounts.some(a=>a.id===last?.account)?last.account:accounts[0].id)}${field('date','Fecha de pago',today,'date','required')}${selectField('split','¿Conoces el capital amortizado?',[['unknown','No, dejar pendiente'],['known','Sí, introducir importe']],'unknown')}<div class="full" id="debtSplit"></div><div class="full hint">La cuota habitual es una referencia; cambiar este pago no modifica los próximos meses. Si ya existe como gasto, utiliza «Vincular gasto».</div>`,'Registrar pago'));const f=document.getElementById('debtPaymentForm'),sync=()=>{document.getElementById('debtSplit').innerHTML=f.elements.split.value==='known'?field('principal','Capital amortizado (€)','','number','min="0" step="0.01" required'):''};f.elements.split.addEventListener('change',sync);sync();submitForm('debtPaymentForm',v=>{const total=Number(v.amount),known=v.split==='known',principal=known?Number(v.principal):null,acc=account(v.account);if(!acc||acc.closedAt||acc.archivedAt||!validDate(v.date)||v.amount===''||!Number.isFinite(total)||total<=0||(known&&(v.principal===''||!Number.isFinite(principal)||principal<0||principal>total||principal>debt.balance))){alert('Revisa el pago y el desglose.');return}if(state.expenses.some(e=>e.account===acc.id&&e.date===v.date&&Math.abs(Number(e.amount)-total)<0.005)){alert('Existe un gasto con el mismo importe, fecha y cuenta. Utiliza «Vincular gasto» para evitar duplicarlo.');return}if(!confirm('¿Registrar '+EUR(total)+' como gasto bancario nuevo? Se descontará una sola vez.'))return;const old=clone();state.expenses.push({id:UID(),account:acc.id,date:v.date,amount:Math.round(total*100)/100,concept:'Cuota de '+debt.name,debtPaymentId:id,principalPaid:principal,interestPaid:known?Math.round((total-principal)*100)/100:null});if(known)debt.balance=Math.round((debt.balance-principal)*100)/100;if(save(old)){closeModal();render();toast('Pago registrado sin duplicidades')}})}
function openTransfer(origin){const active=state.accounts.filter(a=>!a.closedAt&&!a.archivedAt);if(active.length<2){alert('Necesitas dos cuentas.');return}modal('Traspaso entre mis cuentas',formWrap('transferForm',`${selectField('from','Desde',active.map(a=>[a.id,a.name]),active.some(a=>a.id===origin)?origin:active[0].id)}${selectField('to','Hacia',active.map(a=>[a.id,a.name]),active.find(a=>a.id!==(active.some(x=>x.id===origin)?origin:active[0].id)).id)}${field('amount','Importe (€)','','number','min="0.01" step="0.01" required')}${field('date','Fecha',today,'date','required')}${field('concept','Concepto','Traspaso entre cuentas')}<div class="full hint">No se contará como ingreso ni gasto: el patrimonio total no cambia.</div>`));submitForm('transferForm',d=>{if(d.from===d.to||!validDate(d.date)||amount(d.amount)<=0||!Number.isFinite(amount(d.amount))||!active.some(a=>a.id===d.from)||!active.some(a=>a.id===d.to)||amount(d.amount)>balance(d.from)){alert('Selecciona dos cuentas diferentes y un importe válido.');return}const old=clone();state.transfers.push({id:UID(),...d,amount:amount(d.amount)});if(save(old)){closeModal();render();toast('Traspaso guardado')}})}function openExpense(){modal('Registrar gasto',formWrap('expenseForm',`${field('concept','Concepto','','','required')}${field('amount','Importe (€)','','number','min="0.01" step="0.01" required')}${field('date','Fecha',today,'date','required')}${selectField('account','Cuenta de pago',state.accounts.map(a=>[a.id,a.name]),state.accounts[0]?.id)}`));submitForm('expenseForm',d=>{if(!d.concept.trim()||!validDate(d.date)||!Number.isFinite(amount(d.amount))||amount(d.amount)<=0){alert('Revisa los datos.');return}const old=clone();state.expenses.push({id:UID(),...d,amount:amount(d.amount)});if(save(old)){closeModal();render();toast('Gasto registrado')}})}function openCheck(id){const a=account(id);if(!a)return;modal('Comparar saldo bancario · '+a.name,formWrap('checkForm',`${field('date','Fecha de referencia',today,'date','required')}${field('actual','Saldo real del banco (€)','','number','step="0.01" required')}<div class="full notice">Saldo calculado actual: <b>${EUR(balance(id))}</b>. Esta comparación te permite comprobar si el saldo de Salvia coincide con el de tu banco. No modifica el patrimonio ni añade movimientos.</div>`,'Comparar'));submitForm('checkForm',d=>{if(!validDate(d.date)||!Number.isFinite(amount(d.actual))){alert('Saldo o fecha incorrectos.');return}const calculated=balanceAsOf(id,d.date),diff=amount(d.actual)-calculated;modal('Resultado de conciliación',`<div class="grid" style="grid-template-columns:1fr 1fr"><div class="stat"><span>Saldo calculado a fecha</span><strong>${EUR(calculated)}</strong></div><div class="stat"><span>Saldo declarado</span><strong>${EUR(d.actual)}</strong></div></div><div class="notice">Diferencia: <b>${EUR(diff)}</b>. ${Math.abs(diff)<0.005?'Los saldos coinciden.':'Revisa movimientos faltantes, duplicados o fechas antes de corregir.'}</div><div class="actions"><button onclick="closeModal()">Cerrar</button></div>`)} )}function balanceAsOf(id,date){const a=account(id);return Number(a.opening||0)+sum(state.receipts.filter(r=>r.account===id&&r.date<=date))-sum(state.expenses.filter(r=>r.account===id&&r.date<=date))+sum(state.transfers.filter(r=>r.to===id&&r.date<=date))-sum(state.transfers.filter(r=>r.from===id&&r.date<=date))}
function openQuickReceipt(){const cats=Object.entries(categories),acc=state.accounts.filter(a=>!a.closedAt&&!a.archivedAt);modal('Registrar ingreso puntual',formWrap('quickReceipt',`${selectField('category','¿De dónde procede?',cats,'other')}${field('concept','Concepto o procedencia','','','required')}${field('amount','Importe recibido (€)','','number','min="0.01" step="0.01" required')}${field('date','Fecha',today,'date','required')}${selectField('account','¿Dónde lo recibiste?',acc.map(a=>[a.id,a.name]),acc[0]?.id)}<div class="full hint">Si es dinero movido entre tus propias cuentas, usa «Traspaso» en patrimonio. Un préstamo recibido no es un ingreso ordinario. Si es un reembolso, revisa su clasificación antes de guardarlo.</div>`,'Guardar ingreso puntual'));submitForm('quickReceipt',d=>{const n=amount(d.amount);if(!d.concept.trim()||!Number.isFinite(n)||n<=0||!validDate(d.date)||!account(d.account)){alert('Completa concepto, importe, fecha y cuenta.');return}if(d.category==='family'&&/pr[eé]stamo|reembolso/i.test(d.concept)){alert('Los préstamos y reembolsos no deben tratarse como ingresos ordinarios.');return}const old=clone();state.receipts.push({id:UID(),source:null,category:d.category,account:d.account,date:d.date,amount:n,kind:'extra',occurrence:null,concept:d.concept.trim()});if(save(old)){closeModal();render();toast('Ingreso puntual registrado')}})}
function audit(){const issues=[],keys=new Set();for(const r of state.receipts){if(!account(r.account))issues.push('Cobro sin cuenta: '+r.id);if(r.kind==='regular'&&!source(r.source))issues.push('Cobro habitual sin fuente: '+r.id);if(!validDate(r.date)||!Number.isFinite(Number(r.amount))||Number(r.amount)<=0)issues.push('Cobro inválido: '+r.id);if(r.occurrence){if(keys.has(r.occurrence))issues.push('Cobro habitual duplicado: '+r.occurrence);keys.add(r.occurrence)}}for(const t of state.transfers)if(t.from===t.to||!account(t.from)||!account(t.to)||!validDate(t.date)||Number(t.amount)<=0)issues.push('Traspaso inválido: '+t.id);for(const s of state.sources){if(!account(s.account))issues.push('Fuente sin cuenta: '+s.name);if(new Set((s.revisions||[]).map(r=>r.from)).size!==(s.revisions||[]).length)issues.push('Vigencia duplicada: '+s.name)}modal('Comprobación de integridad',issues.length?`<p>Se han encontrado ${issues.length} incidencias:</p><ul>${issues.map(x=>`<li>${E(x)}</li>`).join('')}</ul>`:'<div class="notice">✓ No se han encontrado errores estructurales en las comprobaciones incluidas. Esto no equivale a una conciliación bancaria completa.</div>')}
function downloadBackup(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='salvia-v041-respaldo.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),500)}async function importBackup(ev){if(window.parent?.salviaStore){alert('La importación de respaldos se gestiona desde Configuración de Salvia.');ev.target.value='';return}const f=ev.target.files?.[0];if(!f)return;try{const x=JSON.parse(await f.text());if(x.schema!==40||!Array.isArray(x.accounts)||!Array.isArray(x.sources)||!Array.isArray(x.receipts)||!Array.isArray(x.assets)||!Array.isArray(x.debts)||!Array.isArray(x.expenses)||!Array.isArray(x.transfers))throw Error('Solo se admiten respaldos completos v0.40. La migración desde v0.38 requiere un proceso específico.');if(!confirm('¿Reemplazar todos los datos de esta vista previa por el respaldo seleccionado?'))return;const old=clone();state=x;if(save(old)){render();toast('Respaldo restaurado')}}catch(e){alert(e.message)}finally{ev.target.value=''}}function resetDemo(){if(window.parent?.salviaStore){alert('Para proteger los demás apartados, el restablecimiento se gestiona desde Configuración de Salvia.');return}if(!confirm('¿Restablecer todos los datos de esta vista previa al ejemplo inicial?'))return;const old=clone();state=structuredClone(seed);if(save(old)){render();toast('Ejemplo restablecido')}}
