function sv41FromCanonical(c){

 if(t.type==='income')receipts.push({id:t.id,source:t.incomeSourceId||null,category:t.v41Category||'other',account:t.to||t.account||'',date:t.date,amount:Number(t.amount)||0,kind:t.v41Kind|| (t.incomeSourceId?'regular':'extra'),occurrence:t.v41Occurrence||t.periodKey||null,concept:t.concept||''});

function assetsView(){const cash=sum(state.accounts.map(a=>({amount:balance(a.id)}))),invest=sum(state.assets.filter(a=>a.kind==='investment')),property=sum(state.assets.filter(a=>a.kind!=='investment')),debt=sum(state.debts.map(x=>({amount:x.balance}))),net=cash+invest+property-debt;return `<div class="heading"><div><div class="eyebrow">Cuentas y patrimonio / 01</div><h1>Mi patrimonio e inversiones</h1><p>Todo lo que tienes y lo que debes, sin duplicar cuentas ni movimientos.</p></div><button class="primary" onclick="openAssetChooser()">＋ Añadir elemento</button></div><div class="grid"><div class="stat"><span>Patrimonio neto estimado</span><strong>${EUR(net)}</strong><span>Activos menos deudas</span></div><div class="stat"><span>Dinero en cuentas y efectivo</span><strong>${EUR(cash)}</strong><span>Saldo calculado a partir de movimientos</span></div><div class="stat"><span>Inversiones y bienes</span><strong>${EUR(invest+property)}</strong><span>Valores declarados, no cotizaciones en tiempo real</span></div></div><section class="panel"><div class="panel-head"><div><h2>Ingresos habituales</h2><p class="small">Configúralos una vez. Salvia los programará automáticamente en «Mis ingresos».</p></div><button class="primary tiny" onclick="openSource()">＋ Añadir habitual</button></div>${state.sources.length?state.sources.map(s=>{const v=version(s,monthId(yr,mo));return `<div class="item"><div class="item-head"><div><strong>${E(s.name)}</strong><p class="small">${E(categories[s.category])} · ${E(frequency[v.frequency])} · ${E(account(v.account)?.name||'Sin cuenta')}</p></div><div style="text-align:right"><b>${EUR(v.amount)}</b><div class="small muted">${v.frequency==='irregular'?'Sin programación':'Importe de referencia'}</div></div></div><div class="actions"><button class="tiny" onclick="openSource('${E(s.id)}')">Editar configuración</button><button class="tiny ghost" onclick="go('income')">Ver cobros ↗</button></div></div>`}).join(''):'<div class="empty">Añade tu primer ingreso habitual para generar previsiones automáticas.<div class="actions" style="justify-content:center"><button class="primary" onclick="openSource()">Configurar mi primer ingreso</button></div></div>'}</section><div class="four"><section class="asset-card"><div class="row between"><h2>🏦 Cuentas y efectivo</h2><button class="tiny" onclick="openAccount()">＋ Añadir</button></div><p class="small">Cuentas únicas compartidas con Mis ingresos.</p>${state.accounts.map(a=>`<div class="item"><div class="item-head"><div><strong>${E(a.name)}</strong><p class="small">${a.type==='cash'?'Efectivo':'Cuenta bancaria'}${a.closedAt?' · Cerrada':''}</p></div><b>${EUR(balance(a.id))}</b></div><div class="actions"><button class="tiny ghost" onclick="openAccount('${E(a.id)}')">Editar</button><button class="tiny ghost" onclick="openCheck('${E(a.id)}')">Conciliar</button></div></div>`).join('')}<div class="actions"><button class="tiny" onclick="openTransfer()">↔ Traspasar</button><button class="tiny" onclick="openExpense()">− Registrar gasto</button></div></section><section class="asset-card"><div class="row between"><h2>📈 Inversiones</h2><button class="tiny" onclick="openAsset('investment')">＋ Añadir</button></div><p class="small">Fondos, acciones, depósitos y otros activos.</p>${state.assets.filter(a=>a.kind==='investment').map(a=>assetRow(a)).join('')||'<p>No hay inversiones registradas.</p>'}<strong>${EUR(invest)}</strong></section><section class="asset-card"><div class="row between"><h2>⌂ Bienes y propiedades</h2><button class="tiny" onclick="openAsset('property')">＋ Añadir</button></div><p class="small">Viviendas, vehículos y otros bienes.</p>${state.assets.filter(a=>a.kind!=='investment').map(a=>assetRow(a)).join('')||'<p>No hay bienes registrados.</p>'}<strong>${EUR(property)}</strong></section><section class="asset-card"><div class="row between"><h2>▤ Deudas y financiación</h2><button class="tiny" onclick="openDebt()">＋ Añadir</button></div><p class="small">Capital pendiente, separado del valor de los bienes.</p>${state.debts.map(d=>`<div class="item"><div class="item-head"><strong>${E(d.name)}</strong><b>${EUR(d.balance)}</b></div><button class="tiny ghost" onclick="openDebt('${E(d.id)}')">Editar</button></div>`).join('')||'<p>No hay deudas registradas.</p>'}<strong>${EUR(debt)}</strong></section></div><section class="panel"><div class="panel-head"><h2>Últimos movimientos</h2><span class="pill">Sin duplicidades entre apartados</span></div>${transactionRows()}</section>`}function assetRow(a){return `<div class="item"><div class="item-head"><strong>${E(a.name)}</strong><b>${EUR(a.value)}</b></div><button class="tiny ghost" onclick="openAsset('${E(a.kind)}','${E(a.id)}')">Editar</button></div>`}function transactionRows(){const rows=[...state.receipts.map(x=>({...x,type:'Ingreso',signed:Number(x.amount)})),...state.expenses.map(x=>({...x,type:'Gasto',signed:-Number(x.amount)})),...state.transfers.map(x=>({...x,type:'Traspaso',signed:0}))].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,12);return rows.length?`<table class="table">${rows.map(x=>`<tr><td><b>${E(x.type)}</b><div class="small muted">${E(x.concept||'Movimiento')} · ${E(x.date)}</div></td><td>${x.type==='Traspaso'?EUR(x.amount)+' ↔':EUR(x.signed)}</td></tr>`).join('')}</table>`:'<p>No hay movimientos todavía.</p>'}
function positionModal(){const w=document.querySelector('.modal-wrap');if(!w)return;let offset=0,height=window.innerHeight;try{if(window.parent!==window){const rect=window.frameElement.getBoundingClientRect();offset=Math.max(0,-rect.top);height=Math.max(280,Math.min(window.parent.innerHeight,rect.bottom)-Math.max(0,rect.top))}}catch(e){const v=window.__salviaViewport||{};offset=Number(v.offset)||0;height=Number(v.height)||height}w.style.setProperty('position','absolute','important');w.style.setProperty('inset','auto 0 auto 0','important');w.style.setProperty('top',Math.round(offset)+'px','important');w.style.setProperty('height',Math.round(height)+'px','important');w.style.setProperty('min-height','0','important');const dialog=w.querySelector('.modal');if(dialog)dialog.style.maxHeight=Math.max(240,height-32)+'px'}
function modal(title,body,actions=''){const root=document.getElementById('modalRoot');if(root.parentElement!==document.body)document.body.append(root);root.style.position='absolute';root.style.top='0';root.style.left='0';root.style.right='0';root.style.zIndex='9999';root.innerHTML=`<div class="modal-wrap" onclick="if(event.target===this)closeModal()"><section class="modal" role="dialog" aria-modal="true" aria-label="${E(title)}"><div class="modal-head"><h2>${E(title)}</h2><button class="tiny ghost" onclick="closeModal()" aria-label="Cerrar">✕</button></div>${body}${actions}</section></div>`;positionModal();document.querySelector('.modal input,.modal select,.modal button')?.focus({preventScroll:true});requestAnimationFrame(positionModal)}function closeModal(){document.getElementById('modalRoot').innerHTML=''}function field(name,label,value='',type='text',attr=''){return `<div><label for="f_${E(name)}">${E(label)}</label><input id="f_${E(name)}" name="${E(name)}" type="${type}" value="${E(value)}" ${attr}></div>`}function selectField(name,label,values,v){return `<div><label for="f_${name}">${E(label)}</label><select id="f_${name}" name="${name}">${opts(values,v)}</select></div>`}function formData(id){return Object.fromEntries(new FormData(document.getElementById(id)))}function submitForm(id,fn){document.getElementById(id).addEventListener('submit',e=>{e.preventDefault();fn(formData(id))})}function formWrap(id,fields,button='Guardar'){return `<form id="${id}"><div class="fields">${fields}</div><div class="actions" style="margin-top:20px"><button class="primary" type="submit">${E(button)}</button><button type="button" class="ghost" onclick="closeModal()">Cancelar</button></div></form>`}
function openSource(id){const s=id?source(id):null,category=s?.category||'salary',v=s?version(s,monthId(yr,mo)):null;const body=formWrap('sourceForm',`${selectField('category','Tipo de ingreso',Object.entries(categories),category)}${field('name','Nombre de esta fuente',s?.name||'','','required')}${selectField('frequency','¿Cada cuánto se repite?',Object.entries(frequency),v?.frequency||'monthly')}${field('amount','Importe neto habitual (€)',v?.amount??'','number','min="0" step="0.01" required')}${selectField('mode','Naturaleza del importe',[['fixed','Normalmente fijo'],['variable','Variable / estimado']],v?.mode||'fixed')}${field('start','Desde cuándo',s?.start||today,'date','required')}${selectField('dateRule','¿Cuándo sueles cobrar?', [['day','Día concreto'],['start','A principios de mes'],['end','A finales de mes'],['lastBusiness','Último día laborable'],['firstBusiness','Primer día laborable'],['variable','Sin fecha fija'],['custom','Personalizado']],v?.dateRule||'day')}${field('day','Día concreto (si corresponde)',v?.day||28,'number','min="1" max="31"')}${field('customDateRule','Regla personalizada (opcional)',v?.customDateRule||'')}${selectField('account','Cuenta de destino',[...state.accounts.filter(a=>!a.closedAt||a.id===v?.account).map(a=>[a.id,a.name]),['__new','＋ Crear cuenta nueva']],v?.account||state.accounts[0]?.id)}<div class="full" id="specialFields"></div>${s?field('effective','Aplicar los cambios desde el mes',''+monthId(yr,mo)+'-01','date','required'):''}<div class="full hint">Solo se piden los datos imprescindibles. Las opciones especializadas aparecen según el tipo de ingreso. El historial de cobros confirmados no se modifica.</div>`,'Guardar fuente');modal(s?'Editar ingreso habitual':'Añadir ingreso',body);const f=document.getElementById('sourceForm');f.category.addEventListener('change',()=>specialFields(f.category.value,s));f.account.addEventListener('change',()=>{if(f.account.value==='__new')createAccountInForm(f)});specialFields(category,s);submitForm('sourceForm',d=>saveSource(d,id))}
function createAccountInForm(f){const holder=document.createElement('div');holder.className='full';holder.id='inlineAccount';holder.innerHTML=`<div class="notice"><strong>Nueva cuenta de destino</strong><div class="fields" style="margin-top:10px"><div><label>Nombre de la cuenta</label><input id="newAccountName" placeholder="Ej. Cuenta secundaria" required></div><div><label>Tipo</label><select id="newAccountType"><option value="bank">Cuenta bancaria</option><option value="cash">Efectivo</option></select></div><div><label>Saldo inicial (€)</label><input id="newAccountOpening" type="number" step="0.01" value="0"></div></div><div class="actions"><button type="button" class="tiny primary" id="createAccountBtn">Guardar cuenta</button><button type="button" class="tiny ghost" id="cancelAccountBtn">Cancelar</button></div></div>`;document.getElementById('inlineAccount')?.remove();f.querySelector('.fields').append(holder);document.getElementById('cancelAccountBtn').onclick=()=>{holder.remove();f.account.value=state.accounts[0]?.id||''};document.getElementById('createAccountBtn').onclick=()=>{const name=document.getElementById('newAccountName').value.trim(),type=document.getElementById('newAccountType').value,opening=amount(document.getElementById('newAccountOpening').value);if(!name||!Number.isFinite(opening)){alert('Indica un nombre y un saldo inicial válido.');return}const old=clone(),a={id:UID(),name,type,opening};state.accounts.push(a);if(save(old)){const o=document.createElement('option');o.value=a.id;o.textContent=a.name;f.account.add(o,f.account.options[f.account.options.length-1]);f.account.value=a.id;holder.remove();toast('Cuenta creada sin perder el formulario')}}}

function salaryPreset(){const f=document.getElementById('sourceForm'),sel=document.getElementById('salaryPayPreset');if(!f||!sel)return;const n=sel.value==='custom'?Number(document.getElementById('customPayCount')?.value||12):Number(sel.value);document.getElementById('customPayBox').style.display=sel.value==='custom'?'block':'none';f.elements.pays.value=n;salaryRows(Math.max(0,Math.min(24,n-12)));}

function specialFields(cat,s){const node=document.getElementById('specialFields');if(!node)return;const ex=s?version(s,monthId(yr,mo)).extra||{}:{};node.innerHTML=cat==='salary'?`<div class="panel" style="margin:0"><h3>Tu nómina, sin campos técnicos</h3><p class="small">Configura el importe <b>neto ordinario</b> arriba. Salvia generará las mensualidades y las pagas adicionales que indiques, sin darlas por cobradas.</p>${field('employer','Empresa pagadora (opcional)',ex.employer||'')}<div class="fields"><div><label>¿Cuántas pagas recibes al año?</label><select id="salaryPayPreset" onchange="salaryFormChange()"><option value="12" ${Number(ex.pays||12)===12?'selected':''}>12 pagas (sin extras)</option><option value="14" ${Number(ex.pays||12)===14?'selected':''}>14 pagas</option><option value="17" ${Number(ex.pays||12)===17?'selected':''}>17 pagas</option><option value="custom" ${![12,14,17].includes(Number(ex.pays||12))?'selected':''}>Otra cantidad</option></select></div><div id="customPayBox" style="display:none"><label>Número total de pagas</label><input id="customPayCount" type="number" min="12" max="36" value="${Number(ex.pays||12)}" oninput="salaryPreset()"></div></div><input type="hidden" name="pays" value="${Number(ex.pays||12)}"><div id="salaryRows"></div><div style="margin-top:16px"><strong>Otros complementos habituales</strong><p class="small">Incentivos, bonus, beneficios o comisiones adicionales a las pagas.</p><div id="svBonusRows"></div><button type="button" class="tiny ghost" onclick="addSalaryBonus()">＋ Añadir complemento</button></div><div class="hint">Si recibes varias pagas en el mismo mes, puedes indicar el mismo mes con conceptos diferentes. Los importes adicionales no se suman a la nómina ordinaria hasta confirmar el cobro.</div></div>`:cat==='interest'?`<div class="panel" style="margin:0"><h3>Cuenta remunerada</h3><div class="fields">${field('tae','TAE (%)',ex.tae||'','number','min="0" max="100" step="0.01"')}${field('balance','Saldo de referenci function addSalaryBonus(p={}){const host=document.getElementById('svBonusRows');if(!host)return;const row=document.createElement('div');row.className='sv-bonus';row.style.cssText='border:1px solid #34566a;border-radius:12px;padding:12px;margin:9px 0;display:grid;grid-template-columns:1fr 1fr;gap:9px';row.innerHTML='<label>Concepto<input data-bonus-label placeholder="Ej. Incentivo anual"></label><label>Tipo de cálculo<select data-bonus-method><option value="fixed">Importe fijo</option><option value="percentage">Porcentaje</option><option value="variable">Variable / desconocido</option></select></label><label>Importe o porcentaje<input data-bonus-value type="number" min="0" step=".01" value="0"></label><label>Base de cálculo<select data-bonus-basis><option value="gross">Bruto anual (neto desconocido)</option><option value="base">Salario base (neto desconocido)</option><option value="net_known">Base neta conocida</option><option value="other">Otra base</option></select></label><label>Base neta conocida (€)<input data-bonus-base type="number" min="0" step=".01"></label><label>Periodicidad<select data-bonus-frequency><option value="yearly">Anual</option><option value="quarterly">Trimestral</option><option value="monthly">Mensual</option></select></label><label>Mes de cobro<select data-bonus-month>'+Array.from({length:12},(_,i)=>'<option value="'+(i+1)+'">'+new Date(2026,i,1).toLocaleDateString('es-ES',{month:'long'})+'</option>').join('')+'</select></label><button type="button" class="tiny ghost" onclick="this.closest(\'.sv-bonus\').remove()">Quitar</button>';host.append(row);for(const [k,v] of Object.entries({label:p.label,method:p.method,value:p.value,basis:p.basis,base:p.baseAmount,frequency:p.frequency,month:p.month})){if(v!==undefined&&v!==null){const el=row.querySelector('[data-bonus-'+k+']');if(el)el.value=v}}}
function saveSource(d,id){const form=document.getElementById('sourceForm'),cat=d.category,amt=amount(d.amount),day=Number(d.day),s=id?source(id):null;if(!d.name.trim()||!Number.isFinite(amt)||amt<0||!validDate(d.start)||!Number.isInteger(day)||day<1||day>31){alert('Revisa el nombre, el importe, la fecha y el día habitual.');return}if(!account(d.account)){alert('Selecciona una cuenta válida.');return}if(cat==='family'&&['loan','reimbursement'].includes(d.familyType)){alert('Un préstamo o reembolso no debe registrarse como ingreso nuevo. Usa el apartado de deudas o registra la corrección del gasto.');return}const special=[];if(cat==='salary'){for(const row of form.querySelectorAll('.salary-row')){const m=Number(row.querySelector('[data-month]').value),n=Number(row.querySelector('[data-amount]').value),label=row.querySelector('[data-label]').value.trim();if(!Number.isInteger(m)||m<1||m>12||!Number.isFinite(n)||n<=0){alert('Completa el mes y el importe positivo de cada paga adicional.');return}special.push({month:m,amount:n,label:label||'Paga especial'})}const pays=Number(d.pays);if(!Number.isInteger(pays)||pays<12||pays>36||special.length!==pays-12){alert(`Has indicado ${pays} pagas. Debes configurar exactamente ${pays-12} pagas adicionales a las 12 ordinarias.`);return}}const bonuses=cat==='salary'?[...form.querySelectorAll('.sv-bonus')].map(row=>({label:row.querySelector('[data-bonus-label]').value.trim()||'Complemento',method:row.querySelector('[data-bonus-method]').value,value:Number(row.querySelector('[data-bonus-value]').value),basis:row.querySelector('[data-bonus-basis]').value,baseAmount:Number(row.querySelector('[data-bonus-base]').value)||null,frequency:row.querySelector('[data-bonus-frequency]').value,month:Number(row.querySelector('[data-bonus-month]').value)})):[];if(bonuses.some(x=>!Number.isFinite(x.value)||x.value<0||x.month<1||x.month>12||(x.method==='percentage'&&x.value>100))){alert('Revisa los complementos.');return}const extra=cat==='salary'?{employer:d.employer||'',pays:Number(d.pays),special,bonuses}:cat==='interest'?{tae:Number(d.tae||0),balance:Number(d.balance||0),settlement:d.settlement}:cat==='family'?{familyType:d.familyType}:cat==='rental'?{property:d.property,tenant:d.tenant}:cat==='business'?{client:d.client}:{};if(cat==='interest'&&(!Number.isFinite(extra.tae)||extra.tae<0||extra.tae>100||!Number.isFinite(extra.balance)||extra.balance<0)){alert('TAE o saldo de referencia inválidos.');return}const data={name:d.name.trim(),category:cat,frequency:d.frequency,amount:amt,mode:d.mode,day,dateRule:d.dateRule||'day',customDateRule:(d.customDateRule||'').trim(),account:d.account,extra},old=clone();if(!s){state.sources.push({id:UID(),...data,start:d.start,revisions:[]})}else{const effective=d.effective;if(!validDate(effective)||!effective.endsWith('-01')||effective<s.start.slice(0,7)+'-01'){alert('La vigencia debe ser el primer día de un mes posterior al alta.');return}if(state.receipts.some(r=>r.source===id&&r.occurrence&&r.date.slice(0,7)>=effective.slice(0,7))){alert('Ya existen cobros habituales confirmados desde esa fecha. Elige una vigencia posterior para no alterar períodos confirmados.');return}s.revisions=(s.revisions||[]).filter(r=>r.from!==effective);s.revisions.push({from:effective,data});s.revisions.sort((a,b)=>a.from.localeCompare(b.from))}if(save(old)){closeModal();render();toast('Fuente guardada en su categoría')}}
function openReceipt(sid,occ){const p=occ?plannedPeriod().find(x=>x.key===occ):null,sourceOptions=state.sources.map(s=>[s.id,s.name]);if(!sourceOptions.length){openSource();return}const selected=sid||sourceOptions[0][0],a=source(selected)?.account||state.accounts[0]?.id;modal(p?'Confirmar o ajustar cobro':'Registrar cobro puntual',formWrap('receiptForm',`${selectField('source','Fuente de ingreso',sourceOptions,selected)}${field('date','Fecha del cobro',p?`${p.month}-${pad(Math.min(Number(version(source(selected),p.month).day||28),28))}`:today,'date','required')}${field('amount','Importe realmente recibido (€)',p?.amount??'','number','min="0.01" step="0.01" required')}${selectField('account','Cuenta que recibió el dinero',state.accounts.filter(x=>!x.closedAt).map(x=>[x.id,x.name]),p?.account||a)}${field('concept','Concepto',p?`${p.label} · ${p.month}`:'Cobro puntual','','required')}<div class="full hint">${p?'Modificar esta cantidad no cambia el ingreso habitual de los próximos meses.':'Este cobro se contabilizará una sola vez. No modifica la programación habitual.'}</div>`,'Guardar cobro'));submitForm('receiptForm',d=>{const n=amount(d.amount);if(!validDate(d.date)||!Number.isFinite(n)||n<=0||!source(d.source)||!account(d.account)||!d.concept.trim()){alert('Revisa los datos del cobro.');return}if(p&&state.receipts.some(r=>r.occurrence===p.key)){alert('Este cobro habitual ya está registrado.');return}const old=clone();state.receipts.push({id:UID(),source:d.source,account:d.account,date:d.date,amount:n,kind:p?'regular':'extra',occurrence:p?.key||null,concept:d.concept.trim()});if(save(old)){closeModal();render();toast('Cobro registrado sin duplicarlo')}})}
function openHistory(id){const rows=state.receipts.filter(r=>r.source===id).sort((a,b)=>b.date.localeCompare(a.date));modal('Historial de '+source(id).name,rows.length?rows.map(r=>`<div class="item"><div class="item-head"><div><strong>${EUR(r.amount)}</strong><p>${E(r.date)} · ${E(r.concept)} · ${E(account(r.account)?.name||'Sin cuenta')}</p></div><button class="tiny" onclick="editReceipt('${E(r.id)}')">Corregir</button></div></div>`).join(''):'<p>No hay cobros confirmados.</p>')}
function editReceipt(id){const r=state.receipts.find(x=>x.id===id);if(!r)return;modal('Corregir cobro',formWrap('editReceipt',`${field('date','Fecha',r.date,'date','required')}${field('amount','Importe (€)',r.amount,'number','min="0.01" step="0.01" required')}${selectField('account','Cuenta',state.accounts.map(a=>[a.id,a.name]),r.account)}${field('concept','Concepto',r.concept,'','required')}<div class="full hint">La corrección actualiza el mismo movimiento, sin crear otro.</div>`,'Guardar corrección')+`<div class="actions"><button class="tiny ghost" onclick="deleteReceipt('${E(id)}')">Eliminar cobro incorrecto</button></div>`);submitForm('editReceipt',d=>{if(!validDate(d.date)||amount(d.amount)<=0||!Number.isFinite(amount(d.amount))||!account(d.account)||!d.concept.trim()){alert('Datos incorrectos.');return}const old=clone();Object.assign(r,{date:d.date,amount:amount(d.amount),account:d.account,concept:d.concept.trim()});if(save(old)){closeModal();render();toast('Cobro corregido')}})}function deleteReceipt(id){if(!confirm('¿Eliminar este cobro registrado?'))return;const old=clone();state.receipts=state.receipts.filter(r=>r.id!==id);if(save(old)){closeModal();render();toast('Cobro eliminado')}}

function openTransfer(){if(state.accounts.length<2){alert('Necesitas dos cuentas.');return}modal('Traspaso entre mis cuentas',formWrap('transferForm',`${selectField('from','Desde',state.accounts.map(a=>[a.id,a.name]),state.accounts[0].id)}${selectField('to','Hacia',state.accounts.map(a=>[a.id,a.name]),state.accounts[1].id)}${field('amount','Importe (€)','','number','min="0.01" step="0.01" required')}${field('date','Fecha',today,'date','required')}${field('concept','Concepto','Traspaso entre cuentas')}<div class="full hint">No se contará como ingreso ni gasto: el patrimonio total no cambia.</div>`));submitForm('transferForm',d=>{if(d.from===d.to||!validDate(d.date)||amount(d.amount)<=0||!Number.isFinite(amount(d.amount))){alert('Selecciona dos cuentas diferentes y un importe válido.');return}const old=clone();state.transfers.push({id:UID(),...d,amount:amount(d.amount)});if(save(old)){closeModal();render();toast('Traspaso guardado')}})}function openExpense(){modal('Registrar gasto',formWrap('expenseForm',`${field('concept','Concepto','','','required')}${field('amount','Importe (€)','','number','min="0.01" step="0.01" required')}${field('date','Fecha',today,'date','required')}${selectField('account','Cuenta de pago',state.accounts.map(a=>[a.id,a.name]),state.accounts[0]?.id)}`));submitForm('expenseForm',d=>{if(!d.concept.trim()||!validDate(d.date)||!Number.isFinite(amount(d.amount))||amount(d.amount)<=0){alert('Revisa los datos.');return}const old=clone();state.expenses.push({id:UID(),...d,amount:amount(d.amount)});if(save(old)){closeModal();render();toast('Gasto registrado')}})}function openCheck(id){const a=account(id);modal('Conciliar · '+a.name,formWrap('checkForm',`${field('date','Fecha de referencia',today,'date','required')}${field('actual','Saldo real del banco (€)','','number','step="0.01" required')}<div class="full notice">Saldo calculado actual: <b>${EUR(balance(id))}</b>. La conciliación informa de diferencias; no genera movimientos ficticios.</div>`,'Comparar'));submitForm('checkForm',d=>{if(!validDate(d.date)||!Number.isFinite(amount(d.actual))){alert('Saldo o fecha incorrectos.');return}const calculated=balanceAsOf(id,d.date),diff=amount(d.actual)-calculated;modal('Resultado de conciliación',`<div class="grid" style="grid-template-columns:1fr 1fr"><div class="stat"><span>Saldo calculado a fecha</span><strong>${EUR(calculated)}</strong></div><div class="stat"><span>Saldo declarado</span><strong>${EUR(d.actual)}</strong></div></div><div class="notice">Diferencia: <b>${EUR(diff)}</b>. ${Math.abs(diff)<0.005?'Los saldos coinciden.':'Revisa movimientos faltantes, duplicados o fechas antes de corregir.'}</div><div class="actions"><button onclick="closeModal()">Cerrar</button></div>`)} )}function balanceAsOf(id,date){const a=account(id);return Number(a.opening||0)+sum(state.receipts.filter(r=>r.account===id&&r.date<=date))-sum(state.expenses.filter(r=>r.account===id&&r.date<=date))+sum(state.transfers.filter(r=>r.to===id&&r.date<=date))-sum(state.transfers.filter(r=>r.from===id&&r.date<=date))}
function openQuickReceipt(){const cats=Object.entries(categories),acc=state.accounts.filter(a=>!a.closedAt);modal('Registrar ingreso puntual',formWrap('quickReceipt',`${selectField('category','¿De dónde procede?',cats,'other')}${field('concept','Concepto o procedencia','','','required')}${field('amount','Importe recibido (€)','','number','min="0.01" step="0.01" required')}${field('date','Fecha',today,'date','required')}${selectField('account','¿Dónde lo recibiste?',acc.map(a=>[a.id,a.name]),acc[0]?.id)}<div class="full hint">Si es dinero movido entre tus propias cuentas, usa «Traspaso» en patrimonio. Un préstamo recibido no es un ingreso ordinario. Si es un reembolso, revisa su clasificación antes de guardarlo.</div>`,'Guardar ingreso puntual'));submitForm('quickReceipt',d=>{const n=amount(d.amount);if(!d.concept.trim()||!Number.isFinite(n)||n<=0||!validDate(d.date)||!account(d.account)){alert('Completa concepto, importe, fecha y cuenta.');return}if(d.category==='family'&&/pr[eé]stamo|reembolso/i.test(d.concept)){alert('Los préstamos y reembolsos no deben tratarse como ingresos ordinarios.');return}const old=clone();state.receipts.push({id:UID(),source:null,category:d.category,account:d.account,date:d.date,amount:n,kind:'extra',occurrence:null,concept:d.concept.trim()});if(save(old)){closeModal();render();toast('Ingreso puntual registrado')}})}
function audit(){const issues=[],keys=new Set();for(const r of state.receipts){if(!account(r.account))issues.push('Cobro sin cuenta: '+r.id);if(r.kind==='regular'&&!source(r.source))issues.push('Cobro habitual sin fuente: '+r.id);if(!validDate(r.date)||!Number.isFinite(Number(r.amount))||Number(r.amount)<=0)issues.push('Cobro inválido: '+r.id);if(r.occurrence){if(keys.has(r.occurrence))issues.push('Cobro habitual duplicado: '+r.occurrence);keys.add(r.occurrence)}}for(const t of state.transfers)if(t.from===t.to||!account(t.from)||!account(t.to)||!validDate(t.date)||Number(t.amount)<=0)issues.push('Traspaso inválido: '+t.id);for(const s of state.sources){if(!account(s.account))issues.push('Fuente sin cuenta: '+s.name);if(new Set((s.revisions||[]).map(r=>r.from)).size!==(s.revisions||[]).length)issues.push('Vigencia duplicada: '+s.name)}modal('Comprobación de integridad',issues.length?`<p>Se han encontrado ${issues.length} incidencias:</p><ul>${issues.map(x=>`<li>${E(x)}</li>`).join('')}</ul>`:'<div class="notice">✓ No se han encontrado errores estructurales en las comprobaciones incluidas. Esto no equivale a una conciliación bancaria completa.</div>')}
function downloadBackup(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='salvia-v041-respaldo.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),500)}async function importBackup(ev){if(window.parent?.salviaStore){alert('La importación de respaldos se gestiona desde Configuración de Salvia.');ev.target.value='';return}const f=ev.target.files?.[0];if(!f)return;try{const x=JSON.parse(await f.text());if(x.schema!==40||!Array.isArray(x.accounts)||!Array.isArray(x.sources)||!Array.isArray(x.receipts)||!Array.isArray(x.assets)||!Array.isArray(x.debts)||!Array.isArray(x.expenses)||!Array.isArray(x.transfers))throw Error('Solo se admiten respaldos completos v0.40. La migración desde v0.38 requiere un proceso específico.');if(!confirm('¿Reemplazar todos los datos de esta vista previa por el respaldo seleccionado?'))return;const old=clone();state=x;if(save(old)){render();toast('Respaldo restaurado')}}catch(e){alert(e.message)}finally{ev.target.value=''}}function resetDemo(){if(window.parent?.salviaStore){alert('Para proteger los demás apartados, el restablecimiento se gestiona desde Configuración de Salvia.');return}if(!confirm('¿Restablecer todos los datos de esta vista previa al ejemplo inicial?'))return;const old=clone();state=structuredClone(seed);if(save(old)){render();toast('Ejemplo restablecido')}}
