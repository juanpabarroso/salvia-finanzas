name: Financial acceptance tests
on:
  push:
    branches: [main]
    paths:
      - 'analysis-engine-v01.js'
      - 'analytics-v08.js'
      - 'finance-core-v14.js'
      - 'salvia-patrimonio-v052.html'
      - 'tests/**'
      - '.github/workflows/financial-acceptance.yml'
      - 'index.html'
      - 'navigation-v06.js'
      - 'expenses-v01.js'
      - 'accounts-v041-shell.js'
  pull_request:
    paths:
      - 'analysis-engine-v01.js'
      - 'analytics-v08.js'
      - 'finance-core-v14.js'
      - 'salvia-patrimonio-v052.html'
      - 'tests/**'
      - 'index.html'
      - 'navigation-v06.js'
      - 'expenses-v01.js'
      - 'accounts-v041-shell.js'
      - '.github/workflows/financial-acceptance.yml'
  workflow_dispatch:
jobs:
  financial-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify financial core and patrimonio bridge
        run: |
          node tests/acceptance-finance.cjs
          node tests/acceptance-analysis.cjs
  browser-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start local application
        run: python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/salvia-http.log 2>&1 &
      - name: Test desktop and mobile browser flows
        run: node tests/browser-acceptance.cjs
      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: salvia-browser-diagnostics
          path: |
            /tmp/salvia-http.log
            tests/artifacts/
          if-no-files-found: ignore
