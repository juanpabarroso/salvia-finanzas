name: Financial acceptance tests
on:
  push:
    branches: [main]
    paths:
      - 'finance-core-v14.js'
      - 'salvia-patrimonio-v052.html'
      - 'tests/acceptance-finance.cjs'
      - '.github/workflows/financial-acceptance.yml'
  pull_request:
    paths:
      - 'finance-core-v14.js'
      - 'salvia-patrimonio-v052.html'
      - 'tests/acceptance-finance.cjs'
      - '.github/workflows/financial-acceptance.yml'
  workflow_dispatch:
jobs:
  financial-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify financial core and patrimonio bridge
        run: node tests/acceptance-finance.cjs
